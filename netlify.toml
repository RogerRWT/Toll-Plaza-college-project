# Netlify deploys the Angular app from /frontend
# After Render backend is live, set BACKEND_URL below (no trailing slash)

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/toll-plaza-frontend/browser"

# Proxy /api/* → your Render backend (browser stays on Netlify = no CORS issues)
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-RENDER-URL.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
